# roamiyo-travel-tek — Dockerfile lives in ./ta-api-master.
# Bitbucket only reads bitbucket-pipelines.yml from the REPOSITORY ROOT.
#
# Pipeline triggers ONLY on pushes to `dev`, `testing`, or `production`.
# No `default:` block, so any other branch (cancellation_dev, gst_dev, safe_dev, main, etc.)
# will NOT start any build.
#
# Required Bitbucket repository variables (Repo settings → Pipelines → Repository variables):
#   ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Optional: NPM_TOKEN
#
# Branch → Azure Container Apps:
#   dev        → rg-roamiyo-dev-resource           / ca-roamiyo-travel-tek-dev
#   testing    → rg-roamiyo-travel-tek-testing     / ca-roamiyo-travel-tek-testing
#   production → rg-roamiyo-travel-tek-production  / ca-roamiyo-travel-tek-production
#
# ACR images (unique tag per build → new ACA revision each push):
#   ${ACR_LOGIN_SERVER}/travel-app-travel-tek:dev-<BITBUCKET_BUILD_NUMBER>
#   ${ACR_LOGIN_SERVER}/travel-app-travel-tek:testing-<BITBUCKET_BUILD_NUMBER>
#   ${ACR_LOGIN_SERVER}/travel-app-travel-tek:production-<BITBUCKET_BUILD_NUMBER>
#
# Runtime: `node dist/src/main.js`. Ingress target-port=5050 (SERVER_PORT in .env.development).

definitions:
  services:
    docker:
      memory: 3072

  steps:
    - step: &build-and-push-dev
        name: Build and push image (dev)
        services:
          - docker
        script:
          - cd ta-api-master
          - export IMAGE_TAG=dev-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/travel-app-travel-tek:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > ../image-name.txt
        artifacts:
          - image-name.txt

    - step: &build-and-push-testing
        name: Build and push image (testing)
        services:
          - docker
        script:
          - cd ta-api-master
          - export IMAGE_TAG=testing-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/travel-app-travel-tek:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > ../image-name.txt
        artifacts:
          - image-name.txt

    - step: &build-and-push-production
        name: Build and push image (production)
        services:
          - docker
        script:
          - cd ta-api-master
          - export IMAGE_TAG=production-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/travel-app-travel-tek:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > ../image-name.txt
        artifacts:
          - image-name.txt

    - step: &deploy-azure-dev
        name: Deploy to Azure Container Apps (dev)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-dev-resource
          - export ACA_NAME=ca-roamiyo-travel-tek-dev
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - export ACA_CONTAINER=$(az containerapp show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --query "properties.template.containers[0].name" -o tsv)
          - az containerapp update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --container-name "${ACA_CONTAINER}" --image "${IMAGE_NAME}" --command "node" --args "dist/src/main.js"
          - (az containerapp ingress show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" -o none 2>/dev/null && az containerapp ingress update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --target-port 5050) || az containerapp ingress enable --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --type external --target-port 5050 --transport auto

    - step: &deploy-azure-testing
        name: Deploy to Azure Container Apps (testing)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-travel-tek-testing
          - export ACA_NAME=ca-roamiyo-travel-tek-testing
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - export ACA_CONTAINER=$(az containerapp show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --query "properties.template.containers[0].name" -o tsv)
          - az containerapp update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --container-name "${ACA_CONTAINER}" --image "${IMAGE_NAME}" --command "node" --args "dist/src/main.js"
          - (az containerapp ingress show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" -o none 2>/dev/null && az containerapp ingress update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --target-port 5050) || az containerapp ingress enable --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --type external --target-port 5050 --transport auto

    - step: &deploy-azure-production
        name: Deploy to Azure Container Apps (production)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-travel-tek-production
          - export ACA_NAME=ca-roamiyo-travel-tek-production
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - export ACA_CONTAINER=$(az containerapp show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --query "properties.template.containers[0].name" -o tsv)
          - az containerapp update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --container-name "${ACA_CONTAINER}" --image "${IMAGE_NAME}" --command "node" --args "dist/src/main.js"
          - (az containerapp ingress show --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" -o none 2>/dev/null && az containerapp ingress update --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --target-port 5050) || az containerapp ingress enable --name "${ACA_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" --type external --target-port 5050 --transport auto

pipelines:
  branches:
    dev:
      - step:
          <<: *build-and-push-dev
      - step:
          <<: *deploy-azure-dev
          deployment: development

    testing:
      - step:
          <<: *build-and-push-testing
      - step:
          <<: *deploy-azure-testing
          deployment: staging

    production:
      - step:
          <<: *build-and-push-production
      - step:
          <<: *deploy-azure-production
          deployment: production

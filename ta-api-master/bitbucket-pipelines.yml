# roamiyo-aggregator-layer — repo root is the app (Dockerfile at root).
#
# Bitbucket: Repository settings → Pipelines → Repository variables (secured where noted)
#   ACR_LOGIN_SERVER   e.g. myregistry.azurecr.io
#   ACR_USERNAME, ACR_PASSWORD
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID  (required for deploy — use az account set after login)
# Deploy uses --allow-no-subscriptions on az login when the SP has no default directory subscriptions.
# Optional: NPM_TOKEN (private npm)
#
# RBAC: Grant Contributor (or a role that includes Microsoft.App/containerApps/write) on the
# resource group or subscription to this pipeline's *service principal* (AZURE_CLIENT_ID), not only your user.
#
# Confirm Azure resource group and Container App names for testing/production before first deploy.
#
# Images: each run uses a unique tag (dev|testing|production plus BITBUCKET_BUILD_NUMBER), e.g. dev-42.
# Unique tags force Azure Container Apps to create a new revision; reusing the same tag may not.
# Old tags can accumulate in ACR — prune periodically if you do not use retention policies.
#
# ACR repository: roamiyo-aggregator-layer
#   .../roamiyo-aggregator-layer:dev-<BITBUCKET_BUILD_NUMBER>
#   .../roamiyo-aggregator-layer:testing-<BITBUCKET_BUILD_NUMBER>
#   .../roamiyo-aggregator-layer:production-<BITBUCKET_BUILD_NUMBER>
#
# Branch → Container Apps (dev):
#   dev (resource group: rg-roamiyo-dev-resource):
#     API: ca-roamiyo-aggregator-dev

definitions:
  services:
    docker:
      memory: 3072

  steps:
    - step: &build-and-push-dev
        name: Build and push image (dev)
        services:
          - docker
        script:
          - export IMAGE_TAG=dev-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/roamiyo-aggregator-layer:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > image-name.txt
        artifacts:
          - image-name.txt

    - step: &build-and-push-testing
        name: Build and push image (testing)
        services:
          - docker
        script:
          - export IMAGE_TAG=testing-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/roamiyo-aggregator-layer:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > image-name.txt
        artifacts:
          - image-name.txt

    - step: &build-and-push-production
        name: Build and push image (production)
        services:
          - docker
        script:
          - export IMAGE_TAG=production-${BITBUCKET_BUILD_NUMBER}
          - export IMAGE_NAME="${ACR_LOGIN_SERVER}/roamiyo-aggregator-layer:${IMAGE_TAG}"
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t "${IMAGE_NAME}" .
          - echo "${ACR_PASSWORD}" | docker login "${ACR_LOGIN_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          - docker push "${IMAGE_NAME}"
          - echo "${IMAGE_NAME}" > image-name.txt
        artifacts:
          - image-name.txt

    - step: &deploy-azure-dev
        name: Deploy to Azure Container Apps (dev)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-dev-resource
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account list --output table
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - az containerapp update --name ca-roamiyo-aggregator-dev --resource-group "${AZURE_RESOURCE_GROUP}" --image "${IMAGE_NAME}" --command "node" --args "dist/main.js"

    - step: &deploy-azure-testing
        name: Deploy to Azure Container Apps (testing)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-aggregator-testing
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account list --output table
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - az containerapp update --name ca-roamiyo-aggregator-testing --resource-group "${AZURE_RESOURCE_GROUP}" --image "${IMAGE_NAME}" --command "node" --args "dist/main.js"

    - step: &deploy-azure-production
        name: Deploy to Azure Container Apps (production)
        image: mcr.microsoft.com/azure-cli:2.73.0
        script:
          - export IMAGE_NAME=$(cat image-name.txt)
          - export AZURE_RESOURCE_GROUP=rg-roamiyo-aggregator-production
          - az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}" --allow-no-subscriptions
          - az account list --output table
          - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          - az extension add --name containerapp --upgrade -y
          - az containerapp update --name ca-roamiyo-aggregator-production --resource-group "${AZURE_RESOURCE_GROUP}" --image "${IMAGE_NAME}" --command "node" --args "dist/main.js"

pipelines:
  branches:
    dev:
      - step:
          <<: *build-and-push-dev
      - step:
          <<: *deploy-azure-dev
          deployment: development

    testing:
      - step:
          <<: *build-and-push-testing
      - step:
          <<: *deploy-azure-testing
          deployment: testing

    production:
      - step:
          <<: *build-and-push-production
      - step:
          <<: *deploy-azure-production
          deployment: production

  default:
    - step:
        name: Build only (no deploy)
        services:
          - docker
        script:
          - docker build ${NPM_TOKEN:+--build-arg NPM_TOKEN=${NPM_TOKEN}} -t roamiyo-aggregator-layer:ci .
